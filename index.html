<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5fc"><title>LumiGirl颜值测评</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./index.html">LumiGirl<span>✦</span></a><span>颜值测评</span></header>
<main>
<section id="home"><h1>这是<em>LumiGirl</em>颜值测评</h1><p class="intro">上传一张照片，看看你的颜值娱乐分、明星相似度和上镜风格。</p>
<div class="layout"><div><div id="drop" class="studio">
<label class="frame" for="file" aria-label="选择或更换照片"><span class="spark">✦</span><span class="empty"><i></i><b>Lg.</b></span><img id="preview" alt="所选照片预览" hidden></label>
<label class="pick"><input id="file" aria-describedby="photo-guide" type="file" accept="image/*"><span id="pickText">选择照片</span><span aria-hidden="true">＋</span></label></div>
<p id="photo-guide">建议上传 <strong>正面 · 高清 · 光线均匀</strong> 的个人照，以获得更准确的测评结果。</p>
<p id="feedback" role="status" hidden></p></div>
<div class="controls"><fieldset><legend>性别</legend><div id="gender" class="choices"></div></fieldset><fieldset><legend>风格偏好</legend><div id="style" class="choices styles"></div></fieldset><button id="start" class="primary" disabled>开始颜值测评 <span>↗</span></button><small>评分、明星相似度与排名为算法模拟，仅供娱乐</small></div></div></section>
<section id="scan" hidden>
  <h1>正在分析<span aria-hidden="true">…</span></h1>
  <div class="scanner"><img id="scanPhoto" alt="本次测评照片"><div class="scan-grid" aria-hidden="true"></div><i aria-hidden="true"></i></div>
  <div class="scan-status">
    <div class="scan-line"><p id="phase" role="status"></p><strong id="scanPercent" aria-hidden="true"></strong></div>
    <progress id="scanProgress" max="100" value="0" aria-label="报告生成进度"></progress>
  </div>
</section>
<section id="result" hidden><h1><em>LumiGirl</em>颜值测评</h1><div id="report"></div><div class="actions"><button id="save" class="primary">保存海报 ↗</button><button id="retry">重新测试</button></div><small id="report-note">本测评结果由算法模拟生成，仅供娱乐参考</small></section>
<section id="export" hidden><h2>你的分享海报</h2><p>长按下方海报即可查看保存选项，也可以点击「下载 PNG」。</p><img id="poster" alt="个人测评海报，可长按保存"><div class="actions"><a id="download" class="primary" download="LumiGirl颜值测评.png">下载 PNG ↓</a><button id="back">返回报告</button></div></section>
</main><script src="data.js"></script><script src="app.js"></script></body></html>
